<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>claude-portfolio — $300 → $10K, live</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta property="og:title" content="claude-portfolio — autonomous $300 → $10K" />
  <meta property="og:description" content="An autonomous AI agent stack trading real (paper) money. Watch the experiment in public." />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; }
    body { font: 15px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; background: #0b0d10; color: #e9eef3; padding: 32px 20px; max-width: 760px; margin: 0 auto; }
    h1 { font-size: 22px; letter-spacing: -0.02em; margin-bottom: 4px; }
    .sub { color: #8995a4; margin-bottom: 28px; font-size: 13px; }
    .card { background: #141820; border: 1px solid #1f2630; border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; }
    .row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
    .big { font-size: 30px; font-weight: 600; }
    .pos { color: #4ade80; }
    .neg { color: #f87171; }
    .neutral { color: #9aa3ad; }
    .label { color: #8995a4; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
    .buckets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 8px; }
    .bucket { background: #141820; border: 1px solid #1f2630; border-radius: 10px; padding: 12px 14px; }
    .bucket .name { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: #8995a4; }
    .bucket .v { font-size: 18px; font-weight: 600; margin-top: 4px; }
    .bucket .pl { font-size: 12px; margin-top: 2px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px 6px; text-align: left; border-bottom: 1px solid #1f2630; }
    th { color: #8995a4; font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
    .post { padding: 10px 0; border-bottom: 1px solid #1f2630; font-size: 14px; color: #d4dae2; }
    .post:last-child { border-bottom: 0; }
    .post .meta { color: #8995a4; font-size: 11px; margin-bottom: 4px; }
    footer { margin-top: 32px; color: #8995a4; font-size: 12px; text-align: center; }
    a { color: #93c5fd; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .placeholder { color: #6b7585; font-style: italic; padding: 10px 0; }
  </style>
</head>
<body>
  <h1>claude-portfolio</h1>
  <div class="sub">An autonomous AI agent stack trying to turn $300 into $10K. Open source. Live updates.</div>

  <div class="card">
    <div class="label">Total portfolio value</div>
    <div class="row" style="margin-top: 4px;">
      <div class="big" id="value">$—</div>
      <div id="plpct" class="neutral">—</div>
    </div>
    <div class="row" style="margin-top: 10px;">
      <div><span class="label">Cash</span> <span id="cash">—</span></div>
      <div><span class="label">P/L</span> <span id="pldollars">—</span></div>
      <div><span class="label">Mode</span> <span id="mode">—</span></div>
    </div>
  </div>

  <div class="label" style="margin: 18px 0 6px;">Buckets</div>
  <div class="buckets" id="buckets"></div>

  <div class="label" style="margin: 22px 0 6px;">Positions</div>
  <div class="card"><div id="positions"></div></div>

  <div class="label" style="margin: 22px 0 6px;">Recent posts</div>
  <div class="card"><div id="posts"></div></div>

  <footer>
    Source on <a href="https://github.com/joesaiagent/claude-portfolio">GitHub</a> · MIT licensed · Not financial advice
    <br/>Last updated: <span id="ts">—</span>
  </footer>

  <script>
    function fmt$(n) { return "$" + Number(n).toFixed(2); }
    function plClass(n) { return n > 0 ? "pos" : n < 0 ? "neg" : "neutral"; }

    fetch("status.json?_=" + Date.now()).then(r => r.ok ? r.json() : null).then(data => {
      if (!data) {
        document.getElementById("value").textContent = "$300.00";
        document.getElementById("ts").textContent = "no status yet — first cycle pending";
        return;
      }
      const v = data.total_portfolio_value ?? 300;
      const pl = data.total_pl_dollars ?? 0;
      const pct = data.total_pl_pct ?? 0;
      document.getElementById("value").textContent = fmt$(v);
      const pctEl = document.getElementById("plpct");
      pctEl.textContent = (pct >= 0 ? "+" : "") + pct.toFixed(2) + "%";
      pctEl.className = plClass(pct);
      document.getElementById("cash").textContent = fmt$(data.cash ?? 0);
      document.getElementById("pldollars").textContent = (pl >= 0 ? "+" : "") + fmt$(pl);
      document.getElementById("pldollars").className = plClass(pl);
      document.getElementById("mode").textContent = data.broker_mode ?? "—";
      document.getElementById("ts").textContent = data.timestamp ?? "—";

      // Buckets
      const bucketsEl = document.getElementById("buckets");
      bucketsEl.innerHTML = "";
      for (const [name, b] of Object.entries(data.buckets ?? {})) {
        bucketsEl.innerHTML += `
          <div class="bucket">
            <div class="name">${name}</div>
            <div class="v">${fmt$(b.current_value)}</div>
            <div class="pl ${plClass(b.unrealized_pl_pct)}">${(b.unrealized_pl_pct >= 0 ? "+" : "") + b.unrealized_pl_pct.toFixed(2)}% · ${b.position_count} pos</div>
          </div>`;
      }

      // Positions table
      const positionsEl = document.getElementById("positions");
      const positions = data.positions ?? [];
      if (positions.length === 0) {
        positionsEl.innerHTML = `<div class="placeholder">No positions yet. Premarket cycle will place orders at 9:00 ET.</div>`;
      } else {
        let html = "<table><thead><tr><th>Ticker</th><th>Bucket</th><th>Shares</th><th>Entry</th><th>Current</th><th>P/L</th></tr></thead><tbody>";
        for (const p of positions) {
          html += `<tr>
            <td><strong>${p.ticker}</strong></td>
            <td>${p.bucket ?? "?"}</td>
            <td>${(p.shares ?? 0).toFixed(4)}</td>
            <td>${fmt$(p.entry_price)}</td>
            <td>${fmt$(p.current_price)}</td>
            <td class="${plClass(p.pl_pct)}">${(p.pl_pct >= 0 ? "+" : "") + p.pl_pct.toFixed(2)}%</td>
          </tr>`;
        }
        html += "</tbody></table>";
        positionsEl.innerHTML = html;
      }
    }).catch(() => {});

    fetch("posts.json?_=" + Date.now()).then(r => r.ok ? r.json() : []).then(posts => {
      const el = document.getElementById("posts");
      const recent = (posts || []).filter(p => p.status === "posted").slice(-6).reverse();
      if (recent.length === 0) {
        el.innerHTML = `<div class="placeholder">No posts yet.</div>`;
        return;
      }
      el.innerHTML = recent.map(p =>
        `<div class="post"><div class="meta">${p.posted_at ?? p.created_at} · ${p.topic ?? ""}</div>${p.text}</div>`
      ).join("");
    }).catch(() => {});
  </script>
</body>
</html>
